# Syncs the Gemini key from Secrets Manager into a k8s Secret.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: gemini-external-secret
spec:
  # Re-check Secrets Manager for updates every hour.
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    # Kubernetes Secret the pods read from.
    name: gemini-secret
    creationPolicy: Owner
  data:
    - secretKey: api-key
      remoteRef:
        # Secrets Manager secret name and JSON property.
        key: kuberay-agent/gemini-api-key
        property: api-key
