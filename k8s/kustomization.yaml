# Applies all agent manifests together: kubectl apply -k k8s/
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Places every resource below into this namespace.
namespace: ai-agent

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - secretstore.yaml
  - externalsecret.yaml
  - rayservice.yaml
  - service.yaml

# Deploy job sets the real ECR image: kustomize edit set image kuberay-agent-image=<img>
images:
  - name: kuberay-agent-image
    newTag: latest
