# Public internet-facing NLB that exposes the agent on port 80.
---
apiVersion: v1
kind: Service
metadata:
  name: ai-agent-public
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
spec:
  type: LoadBalancer
  # Targets pods KubeRay marks as ready to serve.
  selector:
    ray.io/serve: "true"
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
  # /chat has no auth — restrict to trusted CIDRs for real use.
  loadBalancerSourceRanges:
    - 0.0.0.0/0
