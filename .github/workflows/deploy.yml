name: deploy

on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  # write: so the workflow can commit the updated image tag back to the repo.
  contents: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # Matches the ecr_repository_name default in Terraform.
  ECR_REPO: kuberay-agent

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}
          # Required for the Dockerfile-specific ignore file (Dockerfile.dockerignore).
          DOCKER_BUILDKIT: "1"
        run: |
          docker build -f app/docker/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Update image tag in kustomization and commit
        env:
          IMAGE: ${{ steps.image.outputs.uri }}
        run: |
          cd k8s
          kustomize edit set image kuberay-agent-image="$IMAGE"
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          if git diff --cached --quiet; then
            echo "No image change to commit."
          else
            git commit -m "ci: update agent image to ${IMAGE}"
            git push
          fi
