name: infra Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: "apply = create infra · destroy = delete app + NLB + infra"
        type: choice
        default: apply
        options:
          - apply
          - destroy

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VERSION: "1.12.2"
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  CLUSTER_NAME: YashAcademy

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # ---------- apply = create infra (one stage per step) ----------
      - name: Terraform Init
        if: ${{ github.event.inputs.action == 'apply' }}
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}"

      - name: Terraform Validate
        if: ${{ github.event.inputs.action == 'apply' }}
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        if: ${{ github.event.inputs.action == 'apply' }}
        working-directory: terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        if: ${{ github.event.inputs.action == 'apply' }}
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Terraform Output
        if: ${{ github.event.inputs.action == 'apply' }}
        working-directory: terraform
        run: terraform output

      - name: Update kubeconfig
        if: ${{ github.event.inputs.action == 'apply' }}
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      - name: Apply summary
        if: ${{ github.event.inputs.action == 'apply' }}
        run: bash scripts/apply-summary.sh

      # ---------- destroy = delete k8s app + NLB, then destroy infra ----------
      - name: Terraform Destroy
        if: ${{ github.event.inputs.action == 'destroy' }}
        run: bash scripts/destroy.sh

      - name: Destroy summary
        if: ${{ github.event.inputs.action == 'destroy' }}
        run: bash scripts/destroy-summary.sh
